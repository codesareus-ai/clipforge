version: "3.9"

# Full ClipForge stack: FastAPI backend + Next.js/Remotion frontend + Redis.
# Bring it up with:  docker compose up --build
# Frontend: http://localhost:3000   Backend API: http://localhost:8000

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    command: npm run dev

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional: enables the Celery worker path (CELERY_ENABLED=true in .env).
  worker:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    depends_on:
      - redis
    command: celery -A app.tasks.celery worker --loglevel=info
    profiles: ["worker"]
